services:
  trusttunnel:
    # Не используйте latest: обновляйте только на проверенный immutable release tag/digest.
    image: ${TRUSTTUNNEL_IMAGE:-ghcr.io/reansn0w/trusttunnel-controller:v0.2.1}
    restart: unless-stopped
    init: false
    stop_grace_period: 20s
    ports:
      # VPN HTTPS/HTTP2 и QUIC/HTTP3.
      - "443:8443/tcp"
      - "443:8443/udp"
      # Встроенный HTTPS AdminUI на отдельном порту.
      - "${TT_ADMIN_PORT:-8444}:8444/tcp"
      # Только ACME HTTP-01.
      - "80:80/tcp"
    environment:
      TT_TLS_SOURCE: ${TT_TLS_SOURCE:-}
      TT_TLS_HOSTNAME: ${TT_TLS_HOSTNAME:-}
      TT_ACME_EMAIL: ${TT_ACME_EMAIL:-}
      TT_TLS_CERTIFICATE_FILE: ${TT_TLS_CERTIFICATE_FILE:-}
      TT_TLS_KEY_FILE: ${TT_TLS_KEY_FILE:-}
      TT_UI_LISTEN: "0.0.0.0:8444"
      TT_PROBE_LISTEN: "127.0.0.1:8081"
    volumes:
      # SQLite, ревизии конфигов, TLS и ACME account.
      - trusttunnel_data:/var/lib/trusttunnel
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/trusttunnel-controller", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  trusttunnel_data:
    driver: local
