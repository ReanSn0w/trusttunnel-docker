<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · TrustTunnel</title><link rel="stylesheet" href="/assets/v1/vendor/bootstrap.min.css"><link rel="stylesheet" href="/assets/v1/app.css"></head><body><main class="container py-5 tt-auth"><h1>TrustTunnel administrator</h1>{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/login"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" required autocomplete="username"><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password"><button class="btn btn-primary" type="submit">Sign in</button></form></main></body></html>
