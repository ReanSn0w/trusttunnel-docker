<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initialize TrustTunnel</title><link rel="stylesheet" href="/assets/v1/vendor/bootstrap.min.css"><link rel="stylesheet" href="/assets/v1/app.css"></head><body><main class="container py-5 tt-auth"><h1>Initialize administrator</h1><p>No default credentials exist. Create the first administrator to unlock this installation.</p>{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/bootstrap"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" required minlength="3" maxlength="64" autocomplete="username"><label class="form-label" for="password">Strong password</label><input class="form-control mb-3" id="password" name="password" type="password" required minlength="14" maxlength="1024" autocomplete="new-password"><button class="btn btn-primary" type="submit">Create administrator</button></form></main></body></html>
