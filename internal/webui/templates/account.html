<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRFToken}}"><title>Account · TrustTunnel</title><link rel="stylesheet" href="/assets/v1/vendor/bootstrap.min.css"><link rel="stylesheet" href="/assets/v1/app.css"></head><body><main class="container py-4 tt-auth"><a href="/">← Dashboard</a><h1 class="mt-3">Administrator account</h1>{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}{{if .Notice}}<div class="alert alert-success">{{.Notice}}</div>{{end}}<form method="post" action="/account/password"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" required autocomplete="current-password"><label class="form-label">New strong password</label><input class="form-control mb-3" type="password" name="new_password" minlength="14" maxlength="1024" required autocomplete="new-password"><button class="btn btn-primary">Rotate password</button></form></main></body></html>
