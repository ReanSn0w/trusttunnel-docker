<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRFToken}}"><title>Events · TrustTunnel</title><link rel="stylesheet" href="/assets/v1/vendor/bootstrap.min.css"><link rel="stylesheet" href="/assets/v1/app.css"><script defer src="/assets/v1/vendor/htmx.min.js"></script></head><body><main class="container py-4 tt-shell"><a href="/">← Dashboard</a><h1 class="mt-3">Apply history</h1>{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}<div id="events" hx-get="/events?limit=50" hx-trigger="every 10s" hx-select="#events" hx-swap="outerHTML"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Time</th><th>Revision</th><th>Type</th><th>Action</th><th>Result</th><th>Error</th></tr></thead><tbody>{{range .Events}}<tr><td>{{.At}}</td><td class="tt-secret">{{.Revision}}</td><td>{{.Kind}}</td><td>{{.Action}}</td><td>{{.Result}}</td><td>{{.Error}}</td></tr>{{else}}<tr><td colspan="6">No events.</td></tr>{{end}}</tbody></table></div>{{if .Next}}<a class="btn btn-outline-secondary" href="/events?before={{.Next}}&limit=50">Older</a>{{end}}</div><h2 class="h4 mt-4">Controller log</h2><pre class="tt-log border p-2">{{.ControllerLogs}}</pre><h2 class="h4 mt-4">Endpoint log</h2><pre class="tt-log border p-2">{{.EndpointLogs}}</pre></main></body></html>
