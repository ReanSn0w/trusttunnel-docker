# Опциональный HTTPS reverse proxy для UI. Требует готовые TLS-файлы.
services:
  trusttunnel:
    environment:
      TT_EXTERNAL_TLS: "true"
      TT_TRUSTED_PROXY: "172.31.250.2/32"
    networks:
      admin:
        ipv4_address: 172.31.250.3

  admin-proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    ports:
      # VPN уже занимает host TCP 443, поэтому UI публикуется на отдельном порту.
      - "${TT_ADMIN_PORT:-8444}:443/tcp"
    volumes:
      - ./deploy/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./secrets/admin.crt:/run/secrets/admin.crt:ro,Z
      - ./secrets/admin.key:/run/secrets/admin.key:ro,Z
    networks:
      admin:
        ipv4_address: 172.31.250.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m

networks:
  admin:
    # Podman disables bridge IP forwarding for internal networks, including
    # published ports. The base stack keeps this network internal; this HTTPS
    # publishing override intentionally enables forwarding.
    internal: false
    ipam:
      config:
        - subnet: 172.31.250.0/29
