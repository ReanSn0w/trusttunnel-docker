# Опциональный UI reverse proxy. Требует отдельный host IP и готовые TLS-файлы.
services:
  trusttunnel:
    environment:
      TT_EXTERNAL_TLS: "true"
      TT_TRUSTED_PROXY: "172.31.250.2/32"
    networks:
      admin:
        ipv4_address: 172.31.250.3

  admin-proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    ports:
      # Отдельный IP для admin hostname; VPN 443 остаётся у TrustTunnel.
      - "${TT_ADMIN_BIND_IP:?Set a dedicated admin IP}:443:443/tcp"
    volumes:
      - ./deploy/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/admin.crt:/run/secrets/admin.crt:ro
      - ./secrets/admin.key:/run/secrets/admin.key:ro
    networks:
      admin:
        ipv4_address: 172.31.250.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m

networks:
  admin:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/29
