name: release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/reansn0w/trusttunnel-controller

jobs:
  test:
    name: Test and scan amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Run tests from Dockerfile
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
      - name: Build scan candidate
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: trusttunnel-controller:scan
          build-args: |
            CONTROLLER_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Block HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trusttunnel-controller:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish amd64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - name: Login to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            CONTROLLER_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Sign and verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          ./scripts/verify-release.sh "$IMAGE@$DIGEST"
