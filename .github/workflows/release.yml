name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trusttunnel-controller

jobs:
  platform:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Build native scan candidate
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: trusttunnel-controller:scan
          build-args: |
            CONTROLLER_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Block HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: trusttunnel-controller:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native platform image with attestations
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          build-args: |
            CONTROLLER_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}

  manifest:
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Create immutable multi-arch manifest
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          short_sha="$(printf '%s' "$REVISION" | cut -c1-12)"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-$short_sha" \
            "$IMAGE:build-$REVISION-amd64" \
            "$IMAGE:build-$REVISION-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "$IMAGE@$digest"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$digest"
