# Локальный smoke-test: self-signed TLS, без ACME и без публичных портов.
# Используйте только вместе с docker-compose.yml.
services:
  trusttunnel-endpoint:
    ports: !override
      - "127.0.0.1:8443:8443/tcp"
      - "127.0.0.1:8443:8443/udp"
    environment:
      TT_CERT_TYPE: "self-signed"
      TT_ACME_EMAIL: ""
