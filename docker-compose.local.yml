# Безопасный local smoke: все опубликованные порты только на loopback.
# Используйте вместе с docker-compose.yml.
services:
  trusttunnel:
    image: trusttunnel-controller:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTROLLER_VERSION: local
        VCS_REF: local
    restart: "no"
    ports: !override
      # VPN TCP/UDP на свободном высоком порту.
      - "127.0.0.1:18443:8443/tcp"
      - "127.0.0.1:18443:8443/udp"
      # HTTPS AdminUI только на loopback.
      - "127.0.0.1:18444:8444/tcp"
    environment:
      TT_UI_LISTEN: "0.0.0.0:8444"
      TT_PROBE_LISTEN: "127.0.0.1:8081"
      TT_ACME_DEFAULT_MODE: "staging"
    volumes: !override
      # Отдельные local-данные никогда не мигрируют production volume.
      - trusttunnel_local_data:/var/lib/trusttunnel

volumes:
  trusttunnel_local_data:
    driver: local
